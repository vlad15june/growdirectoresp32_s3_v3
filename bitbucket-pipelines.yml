image: atlassian/default-image:3

definitions:
  caches:
    pio: ~/.platformio

  steps:
    - step: &build-base-image
        name: Build and Push Base Image
        services:
          - docker
        script:
          - export REGISTRY="registry.digitalocean.com/grow-director-v3-registry"
          - export IMAGE_TAG=$(git rev-parse --short "$BITBUCKET_COMMIT")
          - |
            if [ "$BITBUCKET_BRANCH" = "main" ]; then
              export TARGET_ENV="production"
            elif echo "$BITBUCKET_BRANCH" | grep -q "^release/"; then
              export TARGET_ENV="stage"
            else
              export TARGET_ENV="develop"
            fi
          - export IMAGE_NAME="$REGISTRY/$TARGET_ENV/gd-firmware-ci"
          - docker login --username $DOCKER_LOGIN --password $DOCKER_PASSWORD $REGISTRY
          - docker build -f Dockerfile.ci -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
          - docker push --all-tags "$IMAGE_NAME"

    - step: &test-build
        name: Test and Build Firmware
        script:
          - VERSION=$(cat VERSION)
          - VERSION_CLEAN=$(echo $VERSION | tr -d '"')
          - BRANCH_SAFE=$(echo $BITBUCKET_BRANCH | sed 's/\//-/g')
          - export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION='${VERSION}'"
          
          - echo "Running Tests..."
          - pio test -e native -vvv
          
          - echo "Building firmware version ${VERSION_CLEAN} for branch ${BRANCH_SAFE}"
          - pio run -e esp32-s3-devkitm-1
          
          - mkdir -p artifacts
          - cp .pio/build/esp32-s3-devkitm-1/firmware.bin artifacts/firmware-${VERSION_CLEAN}-${BRANCH_SAFE}.bin
          - |
            cat > artifacts/build-info.json << EOF
            {
              "version": "${VERSION_CLEAN}",
              "branch": "${BITBUCKET_BRANCH}",
              "commit": "${BITBUCKET_COMMIT}",
              "build_number": "${BITBUCKET_BUILD_NUMBER}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
            EOF
          - echo "Build artifacts created:"
          - ls -la artifacts/
        artifacts:
          - artifacts/**

    - step: &upload
        name: Upload Firmware
        script:
          - VERSION=$(cat VERSION)
          - VERSION_CLEAN=$(echo $VERSION | tr -d '"')
          - BRANCH_SAFE=$(echo $BITBUCKET_BRANCH | sed 's/\//-/g')
          - FIRMWARE_FILE="artifacts/firmware-${VERSION_CLEAN}-${BRANCH_SAFE}.bin"
          - |
            if [ "$BITBUCKET_BRANCH" = "main" ]; then
              export UPLOAD_URL="https://gen3.api.growdirector.com"
            elif [ "$BITBUCKET_BRANCH" = "develop" ]; then
              export UPLOAD_URL="https://api-test.growdirector.com"
            elif echo "$BITBUCKET_BRANCH" | grep -q "^release/"; then
              export UPLOAD_URL="https://api.stage.k8s.growdirector.com"
            fi
          - |
            if [ -z "$UPLOAD_URL" ]; then
              echo "Error: UPLOAD_URL could not be determined for branch $BITBUCKET_BRANCH"
              exit 1
            fi
          - echo "Uploading ${FIRMWARE_FILE} to ${UPLOAD_URL}"
          - |
            if [ ! -f "${FIRMWARE_FILE}" ]; then
              echo "Error: Firmware file ${FIRMWARE_FILE} not found!"
              ls -la artifacts/
              exit 1
            fi
          - |
            curl -X POST "${UPLOAD_URL}/api/v1/Firmware/upload" \
              -H "X-CI-Token: ${CI_AUTH_TOKEN}" \
              -H "Content-Type: multipart/form-data" \
              -F "File=@${FIRMWARE_FILE}" \
              -F "Version=${VERSION_CLEAN}" \
              -F "Chip=S3" \
              -F "Board=0" \
              -F "ReleaseNotes=Uploaded via Bitbucket Pipeline commit ${BITBUCKET_COMMIT}" \
              --fail-with-body

pipelines:
  default:
    - step:
        <<: *test-build
        image:
          name: registry.digitalocean.com/grow-director-v3-registry/develop/gd-firmware-ci:latest
          username: $DOCKER_LOGIN
          password: $DOCKER_PASSWORD

  branches:
    develop:
      - step:
          <<: *build-base-image
          condition:
            changesets:
              includePaths:
                - "Dockerfile.ci"
                - "platformio.ini"
                - "scripts/**"
      - step:
          <<: *test-build
          image:
            name: registry.digitalocean.com/grow-director-v3-registry/develop/gd-firmware-ci:latest
            username: $DOCKER_LOGIN
            password: $DOCKER_PASSWORD
      - step:
          <<: *upload
          deployment: development
          condition:
            changesets:
              includePaths:
                - "VERSION"

    # Staging environment - Tests and Build on every commit
    'release/*':
      - step:
          <<: *build-base-image
          condition:
            changesets:
              includePaths:
                - "Dockerfile.ci"
                - "platformio.ini"
                - "scripts/**"
      - step:
          <<: *test-build
          image:
            name: registry.digitalocean.com/grow-director-v3-registry/stage/gd-firmware-ci:latest
            username: $DOCKER_LOGIN
            password: $DOCKER_PASSWORD
      - step:
          <<: *upload
          deployment: staging
          condition:
            changesets:
              includePaths:
                - "VERSION"

    # Production environment - Tests and Build on every commit
    main:
      - step:
          <<: *build-base-image
          condition:
            changesets:
              includePaths:
                - "Dockerfile.ci"
                - "platformio.ini"
                - "scripts/**"
      - step:
          <<: *test-build
          image:
            name: registry.digitalocean.com/grow-director-v3-registry/production/gd-firmware-ci:latest
            username: $DOCKER_LOGIN
            password: $DOCKER_PASSWORD
      - step:
          <<: *upload
          deployment: production
          condition:
            changesets:
              includePaths:
                - "VERSION"
