    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.41100.0
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
build_flags =
    -mtext-section-literals
upload_port = COM4
monitor_speed = 115200
upload_speed = 115200
lib_ignore = ArduinoSTL
lib_deps =
    esp32async/AsyncTCP@3.5.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.17
    marvinroger/AsyncMqttClient@0.9.0
    drug123/Telaire T6700 CO2 Sensor Module Library@1.0.1
    bblanchon/ArduinoJson@6.21.6
    fbiego/ESP32Time@2.0.6
extra_scripts =
    pre:scripts/firmware_version.py
    post:scripts/build_manifest.py

; The same firmware with the Arduino framework built FROM SOURCE as an ESP-IDF
; component, in parallel to the prebuilt-package environments above - the
; production path stays esp32-s3-devkitm-1 until this environment is checked on hardware.
; What this environment changes is only who compiles the framework: the same
; Arduino sources (the pinned framework-arduinoespressif32 package at commit
; dcc1105b IS the source tree the prebuilt SDK was made from) are compiled
; against framework-espidf 3.40407.240606 = ESP-IDF v4.4.7, the IDF version
; recorded in the prebuilt SDK's esp_idf_version.h. The IDF configuration comes
; from ./sdkconfig.defaults - the factory sdkconfig shipped inside the package
; (tools/sdk/esp32s3/sdkconfig, the qio_qspi variant) with the "SPI RAM config"
; menu removed, its single deliberate difference - so the source build
; reproduces the factory decisions instead of inventing its own, and the one it
; does not reproduce is spelled out in that file. The first build resolves it into
; sdkconfig.esp32-s3-devkitm-1-src, which is committed as the record of what
; the build used - and from then on THAT file wins: ESP-IDF gives an existing
; sdkconfig priority over the defaults, so editing sdkconfig.defaults alone is
; a silent no-op that still exits 0. To change an option: edit
; sdkconfig.defaults, DELETE sdkconfig.esp32-s3-devkitm-1-src, rebuild (the
; file regenerates), then confirm the option actually landed - grep it in the
; regenerated file, or compare sdkconfig_resolved_sha256 in
; build_manifest.json, which must change. Commit the regenerated file together
; with the defaults. The partition table is ./default_8MB.csv,
; a byte-for-byte copy of the package's tools/partitions/default_8MB.csv the
; prebuilt environments flash: espidf-based builds do not read the board
; manifest's partition entry, so the copy pins the same layout explicitly.
; board_build.arduino.memory_type is in the same position: it names the prebuilt
; SDK variant the Arduino-path environments compile against, and an espidf-based
; build - which compiles the framework itself - never reads it.
; The project shape ESP-IDF requires (CMakeLists.txt at the root and in src/)
; is committed; the Arduino-path environments never read those files.
;
; build_flags: no PSRAM defines, for the reason given at the first environment -
; with the addition that here the SPI RAM options are genuinely configurable and
; sdkconfig.defaults is where they are configured, off. A -DCONFIG_* would only
; duplicate a definition in the generated sdkconfig.h, which is fatal inside
; mbedtls (it builds with warnings-as-errors).
[env:esp32-s3-devkitm-1-src]
platform = espressif32@7.0.1
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/framework-espidf@3.40407.240606
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.41100.0
    platformio/tool-cmake@3.30.2
board = esp32-s3-devkitm-1
framework = arduino, espidf
; tool-ninja is deliberately NOT pinned: the registry publishes no ninja
; version for both darwin and linux_aarch64 (1.13.2 is mac-only, 1.10.2 is
; linux_aarch64-only), so one exact pin cannot serve the host and the
; reference container. Ninja only drives the CMake configure step - the
; compilation itself runs under SCons - so it does not shape the binary; the
; resolved version is recorded per build in build_manifest.json.
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
build_flags =
    -mtext-section-literals
monitor_speed = 115200
upload_speed = 115200
lib_ignore = ArduinoSTL
lib_deps =
    esp32async/AsyncTCP@3.5.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.17
    marvinroger/AsyncMqttClient@0.9.0
    drug123/Telaire T6700 CO2 Sensor Module Library@1.0.1
    bblanchon/ArduinoJson@6.21.6
    fbiego/ESP32Time@2.0.6
extra_scripts =
    pre:scripts/deterministic_fs_order.py
    pre:scripts/firmware_version.py
    post:scripts/build_manifest.py

; The same source build with smaller TLS record buffers. Both halves of that decision travel
; together: the mbedtls options come from an overlay on sdkconfig.defaults (which stays the
; factory copy), the matching slot geometry of TlsMemoryPool comes from GD_TLS_BUFFER_PROFILE,
; and src/Infrastructure/Adapters/Http/TlsBufferProfile.h checks the two against each other at
; compile time - so an overlay that did not reach the generated sdkconfig fails the build
; instead of leaving the pool sized for buffers that no longer exist.
;
; ESP-IDF reads the defaults through the SDKCONFIG_DEFAULTS cmake variable, which PlatformIO
; forwards from board_build.cmake_extra_args; the paths are relative to the project directory.
; The generated sdkconfig.<env> of each environment is committed, as for the base environment,
; and the same rule applies: it wins over the defaults once it exists, so changing an option
; means editing the overlay, DELETING sdkconfig.<env>, rebuilding, and confirming the value in
; the regenerated file (or via sdkconfig_resolved_sha256 in build_manifest.json).
;
; Neither environment is a production path: they exist to be measured on hardware against the
; real backend. esp32-s3-devkitm-1 and esp32-s3-devkitm-1-src are unaffected by them.
;
; `extends` REPLACES build_flags rather than appending to it, so every flag of
; esp32-s3-devkitm-1-src that shapes the binary is repeated below. A flag added to the parent
; and not repeated here silently does not reach these two environments.
[env:esp32-s3-devkitm-1-src-tls-conservative]
extends = env:esp32-s3-devkitm-1-src
build_flags =
    -mtext-section-literals
    -DGD_TLS_BUFFER_PROFILE=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls-conservative

[env:esp32-s3-devkitm-1-src-tls-aggressive]
extends = env:esp32-s3-devkitm-1-src
build_flags =
    -mtext-section-literals
    -DGD_TLS_BUFFER_PROFILE=2
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls-aggressive

; Diagnostic image only: the conservative-TLS source build - the one the metering runs use - with per-task
; heap tracking compiled in, so that a heap low can be followed by a line naming the FreeRTOS
; tasks that hold the memory, and with the episode trace that goes with it (both behind
; GD_HEAP_FORENSICS; see HeapWatermarkTracer.h). The flag and the overlay travel together and
; ArduinoAdapter.h checks one against the other at compile time, so the flag on an environment
; whose sdkconfig lacks the two options fails the build instead of failing to link.
;
; The overlay is the third SDKCONFIG_DEFAULTS layer, on top of the conservative TLS one; the rule
; about the generated sdkconfig.<env> above applies here as well. build_flags repeats the
; parent's, for the reason given there.
;
; Not a production path and not a candidate for one: tracking adds four bytes to every heap
; block and the walk locks the heap for milliseconds. Built with the same command as the other
; diagnostic images, PLATFORMIO_BUILD_FLAGS included.
[env:esp32-s3-devkitm-1-src-tls-conservative-heap-forensics]
extends = env:esp32-s3-devkitm-1-src-tls-conservative
build_flags =
    -mtext-section-literals
    -DGD_TLS_BUFFER_PROFILE=1
    -DGD_HEAP_FORENSICS
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls-conservative;sdkconfig.defaults.heap-forensics

; The conservative-TLS source build with the WiFi driver's receive budget cut down
; (sdkconfig.defaults.wifi-lean: a block-ack window of 6 instead of 16, channel state
; information off). Candidate for the production profile once it has been measured on hardware; until
; then a diagnostic image like the other source builds. The overlay changes only Kconfig values that
; reach the driver through WIFI_INIT_CONFIG_DEFAULT(); the file explains which ones do not.
;
; Nothing in src/ is compiled differently for this environment, so no compile-time check ties a
; flag to the overlay as GD_TLS_BUFFER_PROFILE and GD_HEAP_FORENSICS do. What proves the overlay
; arrived is the generated sdkconfig.<env> (committed, and the rule above about it winning over
; the defaults applies) and sdkconfig_resolved_sha256 in build_manifest.json. build_flags repeats
; the parent's, for the reason given above.
[env:esp32-s3-devkitm-1-src-tls-conservative-wifi-lean]
extends = env:esp32-s3-devkitm-1-src-tls-conservative
build_flags =
    -mtext-section-literals
    -DGD_TLS_BUFFER_PROFILE=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls-conservative;sdkconfig.defaults.wifi-lean

; Diagnostic image only: the heap-forensics image with the same lean WiFi receive budget, so that the
; per-task heap lines of the two images can be read against each other. The overlay is the
; fourth SDKCONFIG_DEFAULTS layer; everything said about the heap-forensics environment applies.
[env:esp32-s3-devkitm-1-src-tls-conservative-heap-forensics-wifi-lean]
extends = env:esp32-s3-devkitm-1-src-tls-conservative-heap-forensics
build_flags =
    -mtext-section-literals
    -DGD_TLS_BUFFER_PROFILE=1
    -DGD_HEAP_FORENSICS
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls-conservative;sdkconfig.defaults.heap-forensics;sdkconfig.defaults.wifi-lean

; Diagnostic image only: the lean WiFi budget plus the hard ceiling on what the driver may hold at once. The
; two halves of that ceiling travel together, as with the TLS profiles: the counts come from the
; sdkconfig.defaults.wifi-static overlay, the request that makes the driver read them at all comes
; from GD_WIFI_STATIC_BUFFERS, and src/Infrastructure/Adapters/WiFi/WifiDriverBufferProfile.h
; checks the two against each other at compile time - the flag without the overlay does not build.
; The flag belongs only to environments that carry the overlay, and the overlay only reaches a
; build of the framework from source: a prebuilt-framework environment comes with the factory
; configuration compiled into the driver, and asking it to keep those counts would pin about 50 KB.
;
; The same header refuses outright to build the flag into an image with external RAM support
; compiled in: Kconfig then offers no dynamic transmit buffers and no transmit cache below sixteen,
; and the driver pins both pools whole - more memory than the receive ceiling saves. Everything
; said about the heap-forensics and wifi-lean environments applies here too; build_flags repeats
; the parent's, for the reason given above.
[env:esp32-s3-devkitm-1-src-tls-conservative-wifi-lean-static]
extends = env:esp32-s3-devkitm-1-src-tls-conservative-wifi-lean
build_flags =
    -mtext-section-literals
    -DGD_TLS_BUFFER_PROFILE=1
    -DGD_WIFI_STATIC_BUFFERS
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls-conservative;sdkconfig.defaults.wifi-lean;sdkconfig.defaults.wifi-static

; Diagnostic image only: the same ceiling in the heap-forensics image, so that the per-task heap lines say
; what the driver holds under it. The overlay is the fifth SDKCONFIG_DEFAULTS layer.
[env:esp32-s3-devkitm-1-src-tls-conservative-heap-forensics-wifi-lean-static]
extends = env:esp32-s3-devkitm-1-src-tls-conservative-heap-forensics-wifi-lean
build_flags =
    -mtext-section-literals
    -DGD_TLS_BUFFER_PROFILE=1
    -DGD_HEAP_FORENSICS
    -DGD_WIFI_STATIC_BUFFERS
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls-conservative;sdkconfig.defaults.heap-forensics;sdkconfig.defaults.wifi-lean;sdkconfig.defaults.wifi-static

[env:esp32s2dev]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_ignore = ArduinoSTL
lib_deps = 
    marvinroger/AsyncMqttClient@^0.9.0
    drug123/Telaire T6700 CO2 Sensor Module Library@^1.0.1
    bblanchon/ArduinoJson@^6.21.4
    fbiego/ESP32Time@^2.0.0
; Upload settings
upload_speed = 115200
upload_protocol = esptool
; CPU & Flash settings
board_build.f_cpu = 240000000L  ; 240MHz
board_build.f_flash = 80000000L ; 80MHz
board_build.flash_mode = qio
; Flash size
board_build.flash_size = 4MB
; PSRAM configuration
board_build.psram = disabled
; Serial monitor settings
monitor_speed = 115200

[env:native]
platform = native@1.2.1
; test/Mock/native holds host stand-ins for device-only headers (Arduino.h), so
; that production headers such as ArduinoJsonConverter.h can be covered here.
build_flags = -std=gnu++17 -g -O0 -I test/Mock/native
test_ignore = test_embedded
; `pio test` does not build src/ by default, so a class implemented in a .cpp used to be pulled
; into a test by #include'ing that .cpp - which breaks as soon as two tests need the same file
; (`multiple definition` at link time) and hides which sources a test actually links.
; Instead the host-portable layers are compiled into the test binary, once, by layer and not by
; file list: everything except the entry point and the device-only Infrastructure layer (Arduino,
; WiFi, ESP drivers). A new Core/Application .cpp is picked up without touching this file.
;
; The `-<Infrastructure/>` line below selects translation units, so it says less about what the
; tests can reach than it looks. Only six files in that layer are .cpp; everything else is a
; header-only class, and such a class is compiled into the test binary by whichever test includes
; it - filter or no filter. ModbusSensorReader, ModuleConfig, WiFiManager and HybridAPIService are
; already in the host build that way.
;
; So what keeps a given Infrastructure class out is not this line but whatever device header
; the class names. A class that builds its own device adapter - as RestAPIService would with its own
; HttpClientAdapter, which is <HTTPClient.h> plus a TLS stack - stays out; RestAPIService is handed its adapter, and
; test_rest_api_service.cpp executes the production transport.
;
; The line stays as it is. The six device .cpp files (FreeRTOS scheduling, WiFi, button, external
; WDT) have no host stand-in, and admitting them would mean writing one.
test_build_src = yes
build_src_filter =
    +<*>
    -<main.cpp>
    -<Infrastructure/>
; The entity headers take the fixed-width integer types for granted: on the device Arduino.h
; brings them in, in a test Mock/ArduinoMock.h does. A src file compiled as its own translation
; unit has neither, so stdint.h is pre-included (the C header: harmless for the plain-C unity config too).
build_src_flags = -include stdint.h
lib_compat_mode = off
; Pinned to exact resolutions, same policy as the firmware envs: the test
; binary should not silently change between runs either. ArduinoJson deliberately
; matches the firmware envs so tests exercise the same parser the device runs.
lib_deps =
    throwtheswitch/Unity@2.6.1
    bblanchon/ArduinoJson@6.21.6
extra_scripts = pre:scripts/verbose_test.py
debug_tool = gdb
debug_init_break = tbreak setup
debug_build_flags = -O0 -g3 -ggdb3

; The native suite with the diagnostic heap forensics compiled in. The code behind
; GD_HEAP_FORENSICS exists in no other host build, so this is where it is executed; env:native
; stays what proves the images that ship. `extends` replaces build_flags, so native's are repeated.
[env:native-heap-forensics]
extends = env:native
build_flags = -std=gnu++17 -g -O0 -I test/Mock/native -DGD_HEAP_FORENSICS
