; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=0
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
upload_speed = 115200
lib_ignore = ArduinoSTL
lib_deps =
    marvinroger/AsyncMqttClient@^0.9.0
    drug123/Telaire T6700 CO2 Sensor Module Library@^1.0.1
    bblanchon/ArduinoJson@^6.21.4
    fbiego/ESP32Time@^2.0.0

[env:esp32-s3-devkitm-1-win]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=0
upload_port = COM4
monitor_speed = 115200
upload_speed = 115200
lib_ignore = ArduinoSTL
lib_deps =
    marvinroger/AsyncMqttClient@^0.9.0
    drug123/Telaire T6700 CO2 Sensor Module Library@^1.0.1
    bblanchon/ArduinoJson@^6.21.4
    fbiego/ESP32Time@^2.0.0

[env:esp32s2dev]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_ignore = ArduinoSTL
lib_deps = 
    marvinroger/AsyncMqttClient@^0.9.0
    drug123/Telaire T6700 CO2 Sensor Module Library@^1.0.1
    bblanchon/ArduinoJson@^6.21.4
    fbiego/ESP32Time@^2.0.0
; Upload settings
upload_speed = 115200
upload_protocol = esptool
; CPU & Flash settings
board_build.f_cpu = 240000000L  ; 240MHz
board_build.f_flash = 80000000L ; 80MHz
board_build.flash_mode = qio
; Flash size
board_build.flash_size = 4MB
; PSRAM configuration
board_build.psram = disabled
; Serial monitor settings
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=gnu++17 -g -O0
test_ignore = test_embedded
; Production sources the native tests link against. `pio test` does not build src/ by default,
; so a class implemented in a .cpp used to be pulled into a test by #include'ing that .cpp -
; and two tests including the same .cpp collide with `multiple definition` at link time.
; Instead the file is compiled ONCE into the test binary; add a line when a new .cpp is needed.
test_build_src = yes
build_src_filter =
    -<*>
    +<Application/Services/Sensors/SensorService.cpp>
; The entity headers take the fixed-width integer types for granted: on the device Arduino.h
; brings them in, in a test Mock/ArduinoMock.h does. A src file compiled as its own translation
; unit has neither, so stdint.h is pre-included (the C header: harmless for the plain-C unity config too).
build_src_flags = -include stdint.h
lib_compat_mode = off
lib_deps = throwtheswitch/Unity@^2.5.2
extra_scripts = pre:scripts/verbose_test.py
debug_tool = gdb
debug_init_break = tbreak setup
debug_build_flags = -O0 -g3 -ggdb3
