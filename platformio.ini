; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=0
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
upload_speed = 115200
lib_ignore = ArduinoSTL
lib_deps = 
    knolleary/PubSubClient@^2.8.0
    drug123/Telaire T6700 CO2 Sensor Module Library@^1.0.1
    bblanchon/ArduinoJson@^6.21.4

[env:esp32-s3-devkitm-1-win]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=0
upload_port = COM4
monitor_speed = 115200
upload_speed = 115200
lib_ignore = ArduinoSTL
lib_deps = 
    knolleary/PubSubClient@^2.8.0
    drug123/Telaire T6700 CO2 Sensor Module Library@^1.0.1
    bblanchon/ArduinoJson@^6.21.4

[env:esp32s2dev]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_ignore = ArduinoSTL
lib_deps = 
    knolleary/PubSubClient@^2.8.0
    drug123/Telaire T6700 CO2 Sensor Module Library@^1.0.1
    bblanchon/ArduinoJson@^6.21.4 
; Upload settings
upload_speed = 115200
upload_protocol = esptool
; CPU & Flash settings
board_build.f_cpu = 240000000L  ; 240MHz
board_build.f_flash = 80000000L ; 80MHz
board_build.flash_mode = qio
; Flash size
board_build.flash_size = 4MB
; PSRAM configuration
board_build.psram = disabled
; Serial monitor settings
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=gnu++17 -g -O0
test_ignore = test_embedded
lib_compat_mode = off
lib_deps = throwtheswitch/Unity@^2.5.2
extra_scripts = pre:scripts/verbose_test.py
debug_tool = gdb
debug_init_break = tbreak setup
debug_build_flags = -O0 -g3 -ggdb3
