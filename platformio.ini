; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Versions below are pinned to their exact resolutions so that the same
; commit produces the same firmware on any machine. Upgrading any of them is a
; deliberate decision, not a side effect of rebuilding.
; The first four lib_deps entries are transitive dependencies (AsyncMqttClient ->
; AsyncTCP; Telaire T6700 -> Adafruit SSD1306/GFX -> BusIO), pinned explicitly
; because their own dependency specs are open-ended ranges.
; ORDER MATTERS: the Library Manager walks lib_deps top-down and resolves a
; package's dependencies right after installing it. A pinned transitive entry
; listed BELOW its dependent arrives after the free resolution already filled
; the folder and becomes a no-op. Keep the transitive pins above the packages
; that depend on them; do not sort this list.
; scripts/firmware_version.py (pre) supplies the FIRMWARE_VERSION define from the
; VERSION file when the build does not pass one; scripts/build_manifest.py (post)
; writes build_manifest.json next to firmware.bin with every resolved version
; and the binary's sha256.
[env:esp32-s3-devkitm-1]
platform = espressif32@7.0.1
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.41100.0
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
; -mtext-section-literals puts each function's constant pool into that function's own
; .text section instead of a separate .literal section. Xtensa loads such a constant with
; l32r, which reaches at most 256 KB backwards, and the whole dependency graph of
; globals.h is instantiated in one translation unit: of what main.cpp.o puts into the
; linked image, 342 665 B are .text and 14 648 B are literal pools (sections dropped by
; --gc-sections are not counted), and the pool of a function emitted late in the unit
; ends up ~260 KB before its own code. Without this flag the link fails as soon as a
; couple of kilobytes are added anywhere between the two - "dangerous relocation: l32r:
; literal target out of range" - and nothing in a source file says how close that limit
; is. Costs 32 B of flash in this environment and no RAM.
;
; There is no BOARD_HAS_PSRAM here, and no -DCONFIG_SPIRAM_* either: the boards carry no SPI RAM
; chip, and a -DCONFIG_* cannot configure a prebuilt SDK in any case - it only collides with the
; same macro in the SDK's own sdkconfig.h. BOARD_HAS_PSRAM is not a Kconfig option but an
; Arduino-level convention macro, and cores/esp32/esp32-hal-psram.h undefines CONFIG_SPIRAM for
; every translation unit that includes esp32-hal.h when the macro is absent - which is what keeps
; esp32-hal-misc.c from calling psramInit() and probing for a chip that is not there. What the
; macro cannot reach is the prebuilt SDK itself: its libraries are compiled with SPI RAM on, so
; the WiFi driver's cache-TX feature bit stays set in the two prebuilt environments. The macro's
; other effect is Arduino String's capacity ceiling (WString.h): 64 KB without it. Every path that
; fills a String - an HTTP response body, a POST body on the setup access point, a whole file read
; off SPIFFS, which is held twice over while it is copied into a std::string - runs out of heap
; below that ceiling, so it is not what bounds them.
build_flags =
    -mtext-section-literals
monitor_speed = 115200
upload_speed = 115200
lib_ignore = ArduinoSTL
lib_deps =
    esp32async/AsyncTCP@3.5.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.17
    marvinroger/AsyncMqttClient@0.9.0
    drug123/Telaire T6700 CO2 Sensor Module Library@1.0.1
    bblanchon/ArduinoJson@6.21.6
    fbiego/ESP32Time@2.0.6
extra_scripts =
    pre:scripts/firmware_version.py
    post:scripts/build_manifest.py

; Mirror of esp32-s3-devkitm-1 (same pins, same manifest); only upload_port differs.
[env:esp32-s3-devkitm-1-win]
platform = espressif32@7.0.1
